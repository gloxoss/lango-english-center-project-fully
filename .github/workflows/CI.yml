name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ponytail: trimmed from the upstream boilerplate CI. storybook and crowdin
# were dropped - no Storybook stories, no Crowdin secrets. Re-add a job the day
# its inputs exist. `unit` runs against a real Postgres so migrations and
# tenant-isolation behave on the genuine schema. `e2e` (W6, 2026-08-27) runs
# the Playwright suite in tests/*.e2e.ts against the built app + a seeded
# Postgres service - the suite predates this workflow but had never executed
# anywhere. `security` (W7) adds dependency audit, secret scanning (gitleaks,
# config in .gitleaks.toml) and CodeQL SAST; before W7 there was zero security
# scanning in CI.

defaults:
  run:
    working-directory: lango-app

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            lango-app/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('lango-app/package-lock.json') }}-${{ hashFiles('lango-app/src/**') }}

      - name: Build Next.js
        run: npm run build-local
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true' # Only upload Sentry source maps in deployment
          NEXT_PUBLIC_APP_URL: http://localhost:3008

      - if: matrix.node-version == '24.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@v6
        with:
          path: |
            lango-app/.next
            lango-app/next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      # ponytail: 2475 lint errors today, ~2147 of them auto-fixable. Non-blocking so
      # the rest of CI is usable. Run `npm run lint:fix`, clear the remainder, then
      # delete continue-on-error so lint actually gates.
      - name: Linter
        continue-on-error: true
        run: npx next typegen && npm run lint

      - name: Type checking
        run: npm run check:types

      # ponytail: knip has never run against this repo, so its baseline is unknown.
      # Non-blocking until someone reads the first report and clears it.
      - name: Check dependencies
        continue-on-error: true
        run: npm run check:deps

      # ponytail: no missing translation keys, but ~200 unused ones make i18n-check
      # exit 1. Non-blocking until the locale files are pruned.
      - name: I18n check
        continue-on-error: true
        run: npm run check:i18n

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: schoolos_test
          POSTGRES_USER: schoolos_test
          POSTGRES_PASSWORD: schoolos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolos_test -d schoolos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://schoolos_test:schoolos_test@localhost:5432/schoolos_test
      BETTER_AUTH_SECRET: ci-only-secret-32-characters-minimum-length

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Apply migrations
        run: npx drizzle-kit migrate

      - name: Run unit tests
        run: npm run test

  e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: schoolos_test
          POSTGRES_USER: schoolos_test
          POSTGRES_PASSWORD: schoolos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolos_test -d schoolos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://schoolos_test:schoolos_test@localhost:5432/schoolos_test
      BETTER_AUTH_SECRET: ci-only-secret-32-characters-minimum-length

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      # `playwright test` in CI boots the app via `run-s start` (next start),
      # which needs the build produced by the `build` job.
      - name: Restore Next.js build
        uses: actions/cache@v6
        with:
          path: |
            lango-app/.next
            lango-app/next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Apply migrations
        run: npx drizzle-kit migrate

      # E2E signs in as seeded users (teacher prof.01@atlas.ma / Admin123!),
      # so the Postgres service must be seeded before the suite runs.
      - name: Seed database
        run: npx tsx src/scripts/seed-full.ts

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.node-version }}
          path: |
            lango-app/test-results/
            lango-app/playwright-report/
          retention-days: 7

  security:
    strategy:
      matrix:
        node-version: [24.x]

    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks scans the full git history, not just the working tree.
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      # ponytail: 14 known vulnerabilities today (7 high, 7 moderate, npm audit
      # 2026-08-27). Non-blocking so the gate is visible without turning main
      # red on pre-existing debt; remove continue-on-error once triaged.
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high

      # Blocking gate. Rules: defaults (.gitleaks.toml extends useDefault);
      # its allowlist covers only inspected false positives (test fixtures,
      # idempotency keys, doc examples).
      - name: Secret scanning (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --verbose

  codeql:
    name: CodeQL analysis (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ponytail: build only, no registry push - proves the Dockerfile still works on
  # every PR without needing credentials. Add push the day something consumes the
  # image. `load: false` keeps the built layers in the cache and skips the export.
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    # npm ci alone takes ~9 min cold (the full devDependency tree - Storybook,
    # Playwright, Checkly - installs before the build). 15 was too tight for an
    # uncached first run; the gha cache makes subsequent runs far quicker.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: lango-app
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
