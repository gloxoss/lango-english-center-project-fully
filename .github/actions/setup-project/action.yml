name: Setup Node.js and dependencies
description: Setup Node.js environment with npm dependencies

# ponytail: the app lives in lango-app/, not the repo root, so every path here is
# prefixed. Hardcoded rather than parameterised because this repo has one app.

inputs:
  node-version:
    description: Node.js version
    required: true
  restore-nextjs-cache:
    description: Whether to restore Next.js build cache
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: lango-app/package-lock.json

    - name: Restore or cache node_modules
      id: cache-node-modules
      uses: actions/cache@v5
      with:
        path: lango-app/node_modules
        key: node-modules-${{ inputs.node-version }}-${{ hashFiles('lango-app/package-lock.json') }}

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: lango-app
      run: npm ci

    - name: Restore Next.js build output
      if: inputs.restore-nextjs-cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          lango-app/.next
          lango-app/next-env.d.ts
        key: nextjs-build-${{ inputs.node-version }}-${{ github.sha }}
        fail-on-cache-miss: true
