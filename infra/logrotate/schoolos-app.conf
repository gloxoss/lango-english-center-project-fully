# SchoolOS application log rotation (W8) — install on the VPS with:
#   sudo cp infra/logrotate/schoolos-app.conf /etc/logrotate.d/schoolos-app
# Matches the retention posture agreed for database backups (W2): daily
# rotation, 7 daily / 4 weekly / 6 monthly retention horizon = up to ~200 days
# for monthly slices, rotate weekly so weekly buckets exist.
# The app logs JSON to stdout under docker; with `logging: driver: json-file`
# docker already caps size (see docker-compose.yml), so this unit covers any
# file-based logs (e.g. pino file transports or journald exports) under
# /var/log/schoolos.
/var/log/schoolos/*.log {
    daily
    rotate 7
    weekly
    maxage 200
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
}
