<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lango / SchoolOS — Vercel Geist Aesthetic Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    body { font-family: 'Geist', sans-serif; background-color: #000000; color: #ededed; }
    .font-mono { font-family: 'Geist Mono', monospace; }
  </style>
</head>
<body class="p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    <div class="flex items-center justify-between pb-6 border-b border-neutral-800">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-0.5 rounded text-xs font-mono bg-neutral-900 text-neutral-300 border border-neutral-800">VERCEL GEIST STYLE</span>
          <span class="text-xs font-mono text-neutral-500">MONOCHROME & SUB-PIXEL PRECISION</span>
        </div>
        <h1 class="text-2xl font-bold text-white mt-2">SchoolOS Center Operations</h1>
        <p class="text-sm text-neutral-400">High-contrast, zero-distraction administrative portal</p>
      </div>
      <button class="bg-white text-black font-medium text-xs px-4 py-2 rounded transition hover:bg-neutral-200">Deploy New Center</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-neutral-950 border border-neutral-800 rounded-lg p-5">
        <div class="text-xs font-mono text-neutral-500">SYSTEM_HEALTH</div>
        <div class="text-2xl font-bold font-mono text-white mt-1">99.98%</div>
        <div class="text-xs text-neutral-400 mt-2">All 6 server nodes active</div>
      </div>
      <div class="bg-neutral-950 border border-neutral-800 rounded-lg p-5">
        <div class="text-xs font-mono text-neutral-500">API_LATENCY</div>
        <div class="text-2xl font-bold font-mono text-white mt-1">14ms</div>
        <div class="text-xs text-neutral-400 mt-2">Sub-20ms target achieved</div>
      </div>
      <div class="bg-neutral-950 border border-neutral-800 rounded-lg p-5">
        <div class="text-xs font-mono text-neutral-500">ACTIVE_TEACHERS</div>
        <div class="text-2xl font-bold font-mono text-white mt-1">84 Instructors</div>
        <div class="text-xs text-neutral-400 mt-2">Full schedule compliance</div>
      </div>
    </div>
  </div>
</body>
</html>
