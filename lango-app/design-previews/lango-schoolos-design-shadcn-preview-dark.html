<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lango / SchoolOS — Shadcn Minimalist Dark Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
  </style>
</head>
<body class="p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex items-center justify-between pb-6 border-b border-zinc-800">
      <div>
        <span class="px-2.5 py-0.5 rounded-md text-xs font-mono bg-zinc-900 text-zinc-100 border border-zinc-800">SHADCN / RADIX PRIMITIVES (DARK)</span>
        <h1 class="text-2xl font-bold tracking-tight text-white mt-2">SchoolOS Center Administration</h1>
        <p class="text-sm text-zinc-400">Accessible UI primitives and dependable enterprise control.</p>
      </div>
      <button class="bg-zinc-100 hover:bg-zinc-200 text-zinc-900 text-xs px-4 py-2 rounded-md font-medium shadow transition">Add User Account</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-5 shadow-sm">
        <div class="text-xs text-zinc-400 font-medium">Total Registrations</div>
        <div class="text-2xl font-bold text-white mt-1">1,840</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-5 shadow-sm">
        <div class="text-xs text-zinc-400 font-medium">Active Teachers</div>
        <div class="text-2xl font-bold text-white mt-1">42</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-800 rounded-lg p-5 shadow-sm">
        <div class="text-xs text-zinc-400 font-medium">Pending Tasks</div>
        <div class="text-2xl font-bold text-white mt-1">7</div>
      </div>
    </div>
  </div>
</body>
</html>
