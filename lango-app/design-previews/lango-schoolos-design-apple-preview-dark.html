<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lango / SchoolOS — Apple Premium Dark Aesthetic Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background-color: #000000; color: #f5f5f7; }
  </style>
</head>
<body class="p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    <div class="flex items-center justify-between pb-6 border-b border-gray-800">
      <div>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">APPLE PREMIUM STYLE (DARK)</span>
        <h1 class="text-3xl font-semibold tracking-tight text-white mt-2">Student Portal & Learning Journey</h1>
        <p class="text-sm text-gray-400">Fluid visual hierarchy, warm backdrop blur, and intuitive typography</p>
      </div>
      <button class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-5 py-2.5 rounded-full shadow transition">Continue Learning</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-gray-900/80 backdrop-blur-xl border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Course Progress</div>
        <div class="text-3xl font-bold text-white mt-2">78% Complete</div>
        <div class="w-full bg-gray-800 h-2 rounded-full mt-4 overflow-hidden">
          <div class="bg-blue-500 h-2 rounded-full" style="width: 78%"></div>
        </div>
      </div>

      <div class="bg-gray-900/80 backdrop-blur-xl border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Next Live Class</div>
        <div class="text-xl font-bold text-white mt-2">Advanced Academic Writing</div>
        <div class="text-xs text-gray-400 mt-2">Today at 17:00 • Teacher Sarah</div>
      </div>

      <div class="bg-gray-900/80 backdrop-blur-xl border border-gray-800 rounded-2xl p-6 shadow-2xl">
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Certificates</div>
        <div class="text-3xl font-bold text-white mt-2">3 Earned</div>
        <div class="text-xs text-blue-400 font-medium mt-2">View Verified Badges →</div>
      </div>
    </div>
  </div>
</body>
</html>
